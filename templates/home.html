<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Student Tier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="container">
        <section class="card">
            <div class="card-header">
                <a href="{{ url_for('index') }}" class="back-link">&larr; Back to Home</a>
                <h1>Student Performance Prediction</h1>
                <p class="subtitle">Select the student's profile attributes to estimate their performance tier.</p>
            </div>

            <form action="{{ url_for('predict_datapoint') }}" method="POST" class="form-grid">
                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option selected disabled value="">Select gender</option>
                        <option value="female">Female</option>
                        <option value="male">Male</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="race_ethnicity">Race / Ethnicity Group</label>
                    <select id="race_ethnicity" name="race_ethnicity" required>
                        <option selected disabled value="">Select group</option>
                        <option value="group A">Group A</option>
                        <option value="group B">Group B</option>
                        <option value="group C">Group C</option>
                        <option value="group D">Group D</option>
                        <option value="group E">Group E</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="parental_level_of_education">Parental Level of Education</label>
                    <select id="parental_level_of_education" name="parental_level_of_education" required>
                        <option selected disabled value="">Select education level</option>
                        <option value="some high school">Some High School</option>
                        <option value="high school">High School</option>
                        <option value="some college">Some College</option>
                        <option value="associate's degree">Associate's Degree</option>
                        <option value="bachelor's degree">Bachelor's Degree</option>
                        <option value="master's degree">Master's Degree</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="lunch">Lunch Type</label>
                    <select id="lunch" name="lunch" required>
                        <option selected disabled value="">Select lunch type</option>
                        <option value="standard">Standard</option>
                        <option value="free/reduced">Free / Reduced</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <label for="test_preparation_course">Test Preparation Course</label>
                    <select id="test_preparation_course" name="test_preparation_course" required>
                        <option selected disabled value="">Select course status</option>
                        <option value="completed">Completed</option>
                        <option value="none">None</option>
                    </select>
                </div>

                <div class="form-group full-width">
                    <button type="submit" class="btn btn-primary">Predict Performance Tier</button>
                </div>
            </form>

            {% if prediction %}
            <div class="result-box {{ prediction_tier }}">
                <span class="result-label">Model Prediction</span>
                <h2>{{ prediction }}</h2>
            </div>
            {% endif %}
        </section>
    </main>
</body>
</html>
